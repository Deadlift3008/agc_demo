services:
  nats:
    image: nats:2.10-alpine
    command: ["-m", "8222"]            # -m: HTTP-мониторинг на 8222 (http://localhost:8222)
    ports:
      - "4222:4222"                     # клиентский порт NATS
      - "8222:8222"                     # мониторинг (необязательно)

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql выполняется ТОЛЬКО при первой инициализации (пустой volume).
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  chroma:
    image: chromadb/chroma:1.0.0
    ports:
      - "8000:8000"                     # REST API Chroma (удобно дебажить напрямую)
    volumes:
      - chromadata:/data                # персистентность векторов между перезапусками

  vectorizer:
    build: ./vectorizer
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - EMBED_MODEL=intfloat/multilingual-e5-small    # эмбеддер; можно подменить на модель полегче
      - EMBED_DEVICE=cpu                # cpu | cuda | mps — показывается в UI на кнопке
      - HF_HOME=/cache/hf               # кеш Hugging Face — в томе, чтобы не качать ~3 ГБ каждый раз
    volumes:
      - hfcache:/cache/hf
    ports:
      - "9000:9000"                     # FastAPI сервиса векторизации
    depends_on:
      - chroma

  backend:
    build: ./backend
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=8080
      - DATABASE_URL=postgresql://demo:demo@postgres:5432/demo
      - VECTORIZER_URL=http://vectorizer:9000
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  agent:
    build: ./agent
    env_file:
      # OPENROUTER_API_KEY и DEFAULT_MODEL. required: false — без .env compose
      # не падает целиком (агенту без ключа всё равно не работать, а векторный
      # полигон /vector и /memory от него не зависит).
      - path: .env
        required: false
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://demo:demo@postgres:5432/demo
      # Бюджет токенов на ход (перекрывается запросом max_tokens с фронта).
      # Soft stop: TOKEN_BUDGET_RESERVE оставляем под финальный ответ.
      - MAX_TOKENS_PER_TURN=${MAX_TOKENS_PER_TURN:-8000}
      - TOKEN_BUDGET_RESERVE=${TOKEN_BUDGET_RESERVE:-500}
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  chromadata:
  hfcache:
